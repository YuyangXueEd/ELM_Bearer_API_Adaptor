# Merge top-level entries before any [table] in an existing config.
# Apply to user-level CODEX_HOME/config.toml; project-local provider settings are ignored.
model = "gpt-5.5"
model_provider = "elm"
model_reasoning_effort = "low"

[model_providers.elm]
name = "ELM"
base_url = "https://elm.edina.ac.uk/api/v1"
env_key = "ELM_API_KEY"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
